name: Build Car Vibe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CarVibe.apk

      # The app reads this to know an update exists. The version number matches
      # the one Gradle gives the build (run number + 1).
      - name: Write version.json
        run: |
          CODE=$((GITHUB_RUN_NUMBER + 1))
          NOTES=$(git log -1 --pretty=%s | jq -Rs 'rtrimstr("\n")')
          echo "{\"versionCode\": $CODE, \"versionName\": \"1.0.$CODE\", \"notes\": $NOTES}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: CarVibe-apk
          path: |
            CarVibe.apk
            version.json

      # Keeps one stable download link for Downloader and the in-app updater:
      # https://github.com/G41US/car-vibe/releases/latest/download/CarVibe.apk
      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Car Vibe (latest build)
          body: Built from ${{ github.sha }}
          files: |
            CarVibe.apk
            version.json
          make_latest: true
