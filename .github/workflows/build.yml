name: Build Car Vibe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CarVibe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarVibe-apk
          path: CarVibe.apk

      # Keeps one stable download link for Downloader:
      # https://github.com/<you>/<repo>/releases/latest/download/CarVibe.apk
      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Car Vibe (latest build)
          body: Built from ${{ github.sha }}
          files: CarVibe.apk
          make_latest: true
